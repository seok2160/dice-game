<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dice Board Game</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }

/* ── 로비 ── */
#lobby { display: flex; flex-direction: column; align-items: center; justify-content: center;
         min-height: 100vh; gap: 12px; }
#lobby h1 { font-size: 2rem; color: #e94560; margin-bottom: 8px; }
#lobby input, #lobby select {
  padding: 10px 14px; border-radius: 8px; border: 1px solid #444;
  background: #16213e; color: #eee; font-size: 1rem; width: 280px; }
#lobby > button { padding: 10px 28px; border-radius: 8px; border: none;
  background: #e94560; color: #fff; font-size: 1rem; cursor: pointer; width: 280px; }
#lobby > button:hover { background: #c73652; }
.sep { color: #666; font-size: 0.85rem; }
.join-row { display: flex; gap: 8px; width: 280px; }
.join-row input { flex: 1 1 0; min-width: 0; }
.join-row button { flex: 0 0 70px; padding: 10px 0; border-radius: 8px; border: none;
  background: #e94560; color: #fff; font-size: 1rem; cursor: pointer; white-space: nowrap; }
.join-row button:hover { background: #c73652; }

/* ── 게임 ── */
#game { display: none; padding: 16px; max-width: 1200px; margin: 0 auto; }
.top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.top-bar h2 { font-size: 1.2rem; color: #e94560; }
.room-id { background: #16213e; border: 1px solid #444; padding: 4px 12px;
  border-radius: 20px; font-size: 0.85rem; cursor: pointer; }
.room-id:hover { border-color: #e94560; }
.round-info { margin-left: auto; font-size: 0.9rem; color: #aaa; }

#timer-bar { width: 100%; height: 5px; background: #333; border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
#timer-fill { height: 100%; background: #e94560; transition: width 0.5s linear; width: 100%; }

/* ── 플레이어 카드 ── */
#players { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.player-card { background: #16213e; border: 2px solid #333; border-radius: 10px;
  padding: 10px 14px; min-width: 130px; transition: border-color .2s, box-shadow .2s; }
.player-card.active { box-shadow: 0 0 14px rgba(233,69,96,.4); }
.pname  { font-weight: bold; font-size: .95rem; }
.pmoney { color: #f0c040; font-size: 1.05rem; margin-top: 3px; }
.pdice  { font-size: .78rem; color: #aaa; margin-top: 2px; }
.ptag   { font-size: .68rem; padding: 1px 6px; border-radius: 10px;
  background: #e94560; color: #fff; margin-top: 4px; display: inline-block; }

/* ── 보드 ── */
#board { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 18px; }
.slot { background: #16213e; border: 1px solid #333; border-radius: 10px; padding: 10px; min-height: 130px; }
.slot h3 { text-align: center; font-size: .8rem; color: #aaa; margin-bottom: 6px; }
.bills { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; min-height: 28px; }
.bill  { background: #2d5a27; color: #8fce81; padding: 2px 5px; border-radius: 4px; font-size: .72rem; }
.bets-area { border-top: 1px solid #2a2a4a; padding-top: 5px; }
.bet-row { display: flex; align-items: center; gap: 5px; margin-top: 3px; }
.bet-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.bet-lbl { font-size: .72rem; color: #ccc; }

/* ── 액션 패널 ── */
#action-panel { background: #16213e; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
#action-title  { color: #aaa; font-size: .9rem; margin-bottom: 12px; }
#roll-btn { padding: 11px 30px; background: #e94560; color: #fff; border: none;
  border-radius: 8px; font-size: 1.05rem; cursor: pointer; }
#roll-btn:hover:not(:disabled) { background: #c73652; }
#roll-btn:disabled { background: #444; cursor: not-allowed; }

/* 설정 패널 (게임 화면 안) */
#config-panel { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid #2a2a4a; }
#config-panel h4 { font-size: .9rem; color: #aaa; margin-bottom: 10px; }
.cfg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin-bottom: 12px; }
.cfg-grid label { font-size: .8rem; color: #888; display: block; margin-bottom: 3px; }
.cfg-grid select { width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #444;
  background: #1a1a2e; color: #eee; font-size: .85rem; }
.cfg-check { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: #ccc; }
.btn-row { display: flex; gap: 10px; }
.btn-cfg  { padding: 9px 18px; border-radius: 8px; border: none; background: #2c3e6a; color: #eee;
  font-size: .9rem; cursor: pointer; }
.btn-cfg:hover { background: #3a4f8a; }
.btn-start { padding: 9px 22px; border-radius: 8px; border: none; background: #27ae60; color: #fff;
  font-size: .9rem; cursor: pointer; font-weight: bold; }
.btn-start:hover { background: #219a52; }

/* pip 선택 */
#pip-choice { display: none; margin-top: 12px; }
#pip-choice p { margin-bottom: 10px; color: #ccc; font-size: .88rem; }
.pip-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.pip-btn { padding: 10px 14px; border-radius: 8px; border: 2px solid #444; background: #1a1a2e;
  color: #eee; font-size: .9rem; cursor: pointer; text-align: center; transition: border-color .15s; }
.pip-btn:hover:not(:disabled) { border-color: #e94560; color: #e94560; }
.pip-btn:disabled { opacity: .3; cursor: not-allowed; }
.dice-own   { color: #f0c040; font-weight: bold; }
.dice-white { display: inline-block; background: #1a3a5a; color: #7ecef5;
              padding: 1px 6px; border-radius: 4px; font-size: .78em;
              border: 1px solid #3a6a9a; margin-left: 2px; }

/* ── 로그 / 채팅 탭 ── */
.tab-bar { display: flex; gap: 0; margin-bottom: 0; border-radius: 10px 10px 0 0; overflow: hidden; }
.tab-btn { flex: 1; padding: 8px; background: #12122a; border: none; color: #888;
  font-size: .85rem; cursor: pointer; transition: background .15s, color .15s; }
.tab-btn.active { background: #0f0f23; color: #eee; font-weight: bold; }
.tab-btn:hover:not(.active) { background: #1a1a3a; color: #ccc; }
.tab-pane { display: none; background: #0f0f23; border-radius: 0 0 10px 10px; }
.tab-pane.active { display: block; }

#log { padding: 10px 14px; height: 140px; overflow-y: auto; font-size: .8rem; }
#log p { margin: 2px 0; color: #888; line-height: 1.4; }
#log p.sys { color: #5599ff; }
#log p.win { color: #f0c040; font-weight: bold; }
#log p.err { color: #e94560; }

/* 채팅 */
#chat-msgs { height: 140px; overflow-y: auto; padding: 8px 12px; }
.chat-msg { margin: 4px 0; font-size: .82rem; line-height: 1.45; word-break: break-all; }
.chat-msg .chat-nick { font-weight: bold; margin-right: 5px; }
.chat-msg .chat-time { color: #555; font-size: .72rem; margin-left: 4px; }
.chat-input-row { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid #1a1a3a; }
#chat-input { flex: 1; background: #16213e; border: 1px solid #333; border-radius: 6px;
  color: #eee; padding: 6px 10px; font-size: .85rem; outline: none; }
#chat-input:focus { border-color: #e94560; }
#chat-send { padding: 6px 14px; background: #e94560; color: #fff; border: none;
  border-radius: 6px; cursor: pointer; font-size: .85rem; white-space: nowrap; }
#chat-send:hover { background: #c73652; }
#chat-badge { display: none; background: #e94560; color: #fff; border-radius: 10px;
  font-size: .7rem; padding: 1px 6px; margin-left: 5px; vertical-align: middle; }

/* ── 우승자 배너 ── */
#winner-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75);
  z-index: 500; align-items: center; justify-content: center;
}
#winner-overlay.show { display: flex; }
#winner-card {
  background: #16213e; border: 2px solid #f0c040; border-radius: 16px;
  padding: 32px 40px; text-align: center; max-width: 420px; width: 90%;
  animation: popIn .3s ease;
}
@keyframes popIn {
  from { transform: scale(.8); opacity: 0; }
  to   { transform: scale(1);  opacity: 1; }
}
#winner-card .trophy  { font-size: 3rem; margin-bottom: 10px; }
#winner-card .wt      { font-size: 1.1rem; color: #aaa; margin-bottom: 6px; }
#winner-card .wname   { font-size: 1.8rem; font-weight: bold; color: #f0c040; margin-bottom: 8px; }
#winner-card .wmembers { font-size: .92rem; color: #ccc; margin-bottom: 18px; }
#winner-card .wclose  {
  padding: 9px 28px; background: #e94560; color: #fff; border: none;
  border-radius: 8px; font-size: 1rem; cursor: pointer;
}
#winner-card .wclose:hover { background: #c73652; }
</style>
</head>
<body>

<!-- 로비 -->
<div id="lobby">
  <h1>🎲 Dice Board</h1>
  <input id="nick-input" placeholder="닉네임 입력" maxlength="20">
  <button id="create-btn">방 만들기</button>
  <div class="sep">─── 또는 ───</div>
  <div class="join-row">
    <input id="room-input" placeholder="방 코드 (8자리)" maxlength="8">
    <button id="join-btn">입장</button>
  </div>
  <div id="lobby-err" style="color:#e94560;font-size:.85rem;min-height:18px;"></div>
  <div id="tunnel-box" style="display:none;margin-top:18px;background:#16213e;border:1px solid #2a5298;
       border-radius:10px;padding:12px 16px;width:280px;text-align:center;">
    <div style="font-size:.75rem;color:#aaa;margin-bottom:6px;">🌐 외부 접속용 공개 URL</div>
    <div id="tunnel-url" style="font-size:.85rem;color:#5bc8f5;word-break:break-all;cursor:pointer;"
         title="클릭해서 복사" onclick="copyTunnel()"></div>
    <div style="font-size:.7rem;color:#666;margin-top:5px;">클릭해서 복사 · 이 주소를 친구에게 공유하세요</div>
  </div>
</div>

<!-- 우승자 오버레이 -->
<div id="winner-overlay">
  <div id="winner-card">
    <div class="trophy">🏆</div>
    <div class="wt" id="winner-label"></div>
    <div class="wname" id="winner-name"></div>
    <div class="wmembers" id="winner-members"></div>
    <button class="wclose" onclick="closeWinnerOverlay()">확인</button>
  </div>
</div>

<!-- 게임 화면 -->
<div id="game">
  <div class="top-bar">
    <h2>🎲 Dice Board</h2>
    <span class="room-id" id="room-label" title="클릭해서 코드 복사">방 코드: ——</span>
    <span id="share-btn" title="공개 URL 복사" onclick="copyPublicUrl()"
          style="display:none;background:#16213e;border:1px solid #2a5298;padding:4px 10px;
                 border-radius:20px;font-size:0.8rem;cursor:pointer;color:#5bc8f5;">🌐 URL 복사</span>
    <span class="round-info" id="round-label">대기 중</span>
  </div>
  <div id="reconnect-banner" style="display:none;background:#7d2f2f;color:#ffb3b3;
       text-align:center;padding:8px;font-size:.85rem;border-radius:6px;margin-bottom:8px;">
    ⚠️ 연결이 끊겼습니다. 재연결 중...
  </div>
  <div id="timer-bar"><div id="timer-fill"></div></div>

  <div id="players"></div>
  <div id="board"></div>

  <div id="action-panel">
    <div id="action-title">연결 중...</div>
    <button id="roll-btn" disabled>🎲 주사위 굴리기</button>

    <!-- pip 선택 (굴린 후) -->
    <div id="pip-choice">
      <p>배팅할 눈을 선택하세요 — 해당 눈의 주사위 전부가 배팅됩니다</p>
      <div class="pip-btns" id="pip-btns"></div>
    </div>

    <!-- 방장 설정 (WAITING 단계에서만 표시) -->
    <div id="config-panel">
      <h4>⚙️ 게임 설정 (방장만 변경 가능)</h4>
      <div class="cfg-grid">
        <div>
          <label>모드</label>
          <select id="cfg-mode">
            <option value="individual">개인전 (2~4인)</option>
            <option value="2v2">팀전 2v2 (4인 전용)</option>
          </select>
        </div>
        <div>
          <label>라운드 수</label>
          <select id="cfg-rounds">
            <option value="1">1라운드</option>
            <option value="2">2라운드</option>
            <option value="3">3라운드</option>
            <option value="4">4라운드</option>
          </select>
        </div>
        <div>
          <label>턴 제한시간</label>
          <select id="cfg-time">
            <option value="30000">30초</option>
            <option value="60000">60초</option>
            <option value="999999">무제한 (테스트용)</option>
          </select>
        </div>
        <div style="display:flex;align-items:flex-end;padding-bottom:2px;">
          <label class="cfg-check">
            <input type="checkbox" id="cfg-white" style="width:auto;">
            흰색 주사위 사용
          </label>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-cfg" id="add-bot-btn" onclick="addBot()">🤖 AI 추가</button>
        <button class="btn-cfg" id="apply-config">설정 적용</button>
        <button class="btn-start" id="start-btn">▶ 게임 시작!</button>
      </div>
    </div>
  </div>

  <!-- 로그 / 채팅 탭 -->
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-log-btn" onclick="switchTab('log')">📋 로그</button>
    <button class="tab-btn" id="tab-chat-btn" onclick="switchTab('chat')">
      💬 채팅<span id="chat-badge"></span>
    </button>
  </div>
  <div class="tab-pane active" id="tab-log">
    <div id="log"></div>
  </div>
  <div class="tab-pane" id="tab-chat">
    <div id="chat-msgs"></div>
    <div class="chat-input-row">
      <input id="chat-input" placeholder="메시지 입력..." maxlength="200"
             onkeydown="if(event.key==='Enter')sendChat()">
      <button id="chat-send" onclick="sendChat()">전송</button>
    </div>
  </div>
</div>

<script>
// ─── 전역 상태 ────────────────────────────────────────────────────────────────
let socket, myPlayerId, myRoomId, isHost = false;
let gameState = null, currentRoll = null;
let timerInterval = null;

// ─── 공개 URL 표시 ────────────────────────────────────────────────────────────
(async function loadTunnelUrl() {
  try {
    const res  = await fetch('/api/tunnel-url');
    const data = await res.json();
    if (data.url) {
      _tunnelUrl = data.url;
      document.getElementById('tunnel-url').textContent = data.url;
      document.getElementById('tunnel-box').style.display = 'block';
      document.getElementById('share-btn').style.display  = 'inline-block';
    }
  } catch { /* 로컬 전용 환경이면 무시 */ }
})();

function showReconnectBanner() {
  const b = document.getElementById('reconnect-banner');
  if (b) b.style.display = 'block';
}
function hideReconnectBanner() {
  const b = document.getElementById('reconnect-banner');
  if (b) b.style.display = 'none';
}

let _tunnelUrl = '';

function copyTunnel() {
  if (!_tunnelUrl) return;
  navigator.clipboard.writeText(_tunnelUrl).then(() => {
    const el = document.getElementById('tunnel-url');
    const orig = el.textContent;
    el.textContent = '✅ 복사됨!';
    setTimeout(() => { el.textContent = orig; }, 1500);
  });
}

function copyPublicUrl() {
  if (!_tunnelUrl) return;
  navigator.clipboard.writeText(_tunnelUrl).then(() => {
    const btn = document.getElementById('share-btn');
    const orig = btn.textContent;
    btn.textContent = '✅ 복사됨!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  });
}

// ─── 서버 기동 대기 오버레이 ──────────────────────────────────────────────────
let _wakeTimer = null;
function showWakeOverlay() {
  let el = document.getElementById('wake-overlay');
  if (!el) {
    el = document.createElement('div');
    el.id = 'wake-overlay';
    el.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,.82);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      z-index:999;color:#eee;font-size:1rem;gap:18px;`;
    el.innerHTML = `
      <div style="font-size:2rem">🎲</div>
      <div style="font-weight:bold">서버를 시작하는 중입니다...</div>
      <div style="font-size:.85rem;color:#aaa">무료 서버는 첫 접속 시 최대 60초가 걸릴 수 있습니다.</div>
      <div style="width:200px;height:4px;background:#333;border-radius:2px;overflow:hidden">
        <div id="wake-bar" style="height:100%;background:#e94560;width:0%;transition:width 1s linear"></div>
      </div>`;
    document.body.appendChild(el);
    let pct = 0;
    const iv = setInterval(() => {
      pct = Math.min(pct + 1.8, 95);
      const bar = document.getElementById('wake-bar');
      if (bar) bar.style.width = pct + '%';
      else clearInterval(iv);
    }, 1000);
    el._iv = iv;
  }
  el.style.display = 'flex';
}
function hideWakeOverlay() {
  const el = document.getElementById('wake-overlay');
  if (el) {
    clearInterval(el._iv);
    const bar = document.getElementById('wake-bar');
    if (bar) bar.style.width = '100%';
    setTimeout(() => { if (el) el.style.display = 'none'; }, 400);
  }
  if (_wakeTimer) { clearTimeout(_wakeTimer); _wakeTimer = null; }
}

// ─── Socket 연결 ──────────────────────────────────────────────────────────────
function connect() {
  // 10초 안에 연결 안 되면 "서버 기동 중" 오버레이 표시
  _wakeTimer = setTimeout(showWakeOverlay, 10000);

  socket = io(location.origin, {
    autoConnect: false,
    reconnection: true,
    reconnectionAttempts: Infinity,
    reconnectionDelay: 2000,
    reconnectionDelayMax: 8000,
    timeout: 60000,
  });

  socket.on('connect', () => {
    hideWakeOverlay();
    log('서버 연결됨', 'sys');
    hideReconnectBanner();
    if (myRoomId && myPlayerId) {
      socket.emit('room:state', { roomId: myRoomId, playerId: myPlayerId }, (res) => {
        if (res?.ok) { gameState = res.data; renderGame(); }
      });
    }
  });

  socket.on('disconnect', (reason) => {
    log('연결 끊김 — 재연결 시도 중...', 'err');
    showReconnectBanner();
  });

  socket.on('connect_error', () => {
    showReconnectBanner();
  });

  socket.on('state:update', (state) => {
    gameState = state;
    if (state.phase === 'WAITING') closeWinnerOverlay();
    renderGame();
  });

  socket.on('turn:rolled', ({ roll }) => {
    currentRoll = roll;
    renderActions(gameState); // pip 선택 UI 표시
  });
  socket.on('turn:rolling',      ({ playerId }) => log(`${nick(playerId)}이(가) 굴리는 중...`));
  socket.on('turn:timeout',      ({ playerId }) => log(`⏰ ${nick(playerId)} 타임아웃 — 자동처리`, 'sys'));
  socket.on('player:joined',     ({ player })   => log(`👤 ${player.nickname} 입장`));
  socket.on('player:disconnected',({ playerId }) => log(`🔌 ${nick(playerId)} 연결 끊김`, 'err'));
  socket.on('game:ended', ({ winner, winnerDetails }) => {
    log(`🏆 게임 종료! 승자: ${winner}`, 'win');
    stopTimer();
    showWinnerOverlay(winner, winnerDetails);
  });

  socket.on('chat:message', (msg) => {
    appendChat({ ...msg, isMe: msg.playerId === myPlayerId });
  });

  socket.connect();
}

// ─── 로비 버튼 ────────────────────────────────────────────────────────────────
document.getElementById('create-btn').onclick = () => {
  const nickname = document.getElementById('nick-input').value.trim();
  if (!nickname) return lobbyErr('닉네임을 입력하세요');
  connect();
  socket.emit('room:create', { nickname }, (res) => {
    if (!res.ok) return lobbyErr(res.msg);
    myPlayerId = res.data.playerId;
    myRoomId   = res.data.roomId;
    isHost     = true;
    gameState  = res.data.state;
    enterGame();
    renderGame();
    log(`방 생성됨 — 코드: ${myRoomId}`, 'sys');
  });
};

document.getElementById('join-btn').onclick = () => {
  const nickname = document.getElementById('nick-input').value.trim();
  const roomId   = document.getElementById('room-input').value.trim().toUpperCase();
  if (!nickname) return lobbyErr('닉네임을 입력하세요');
  if (!roomId)   return lobbyErr('방 코드를 입력하세요');
  connect();
  socket.emit('room:join', { roomId, nickname }, (res) => {
    if (!res.ok) return lobbyErr(res.msg);
    myPlayerId = res.data.playerId;
    myRoomId   = roomId;
    gameState  = res.data.state;
    enterGame();
    renderGame();
    log(`방 ${roomId} 입장 완료`, 'sys');
  });
};

// ─── AI 추가 ──────────────────────────────────────────────────────────────────
function addBot() {
  socket.emit('bot:add', {}, (res) => {
    if (!res.ok) log('AI 추가 실패: ' + res.msg, 'err');
  });
}

// ─── 설정 / 시작 ──────────────────────────────────────────────────────────────
document.getElementById('apply-config').onclick = () => {
  const config = {
    mode:         document.getElementById('cfg-mode').value,
    totalRounds:  Number(document.getElementById('cfg-rounds').value),
    useWhiteDice: document.getElementById('cfg-white').checked,
    turnTimeMs:   Number(document.getElementById('cfg-time').value),
  };
  socket.emit('room:configure', { config }, (res) => {
    if (!res.ok) log(`설정 오류: ${res.msg}`, 'err');
    else         log('설정 적용됨', 'sys');
  });
};

document.getElementById('start-btn').onclick = () => {
  socket.emit('game:start', {}, (res) => {
    if (!res.ok) log(`시작 오류: ${res.msg}`, 'err');
  });
};

// ─── 게임 액션 ────────────────────────────────────────────────────────────────
document.getElementById('roll-btn').onclick = () => {
  socket.emit('turn:roll', {}, (res) => {
    if (!res.ok) log(res.msg, 'err');
  });
};

document.getElementById('room-label').onclick = () => {
  if (!myRoomId) return;
  navigator.clipboard?.writeText(myRoomId).catch(() => {});
  log(`방 코드 복사됨: ${myRoomId}`, 'sys');
};

// ─── render ───────────────────────────────────────────────────────────────────
function renderGame() {
  if (!gameState) return;
  const s = gameState;

  document.getElementById('room-label').textContent  = `방 코드: ${s.roomId}  (클릭해서 복사)`;
  document.getElementById('round-label').textContent =
    s.phase === 'WAITING' ? '대기 중' : `라운드 ${s.currentRound} / ${s.config.totalRounds}`;

  renderPlayers(s);
  renderBoard(s);
  renderActions(s);
  updateTimer(s);
}

function renderPlayers(s) {
  const curPid = s.turnOrder[s.currentTurnIdx];
  document.getElementById('players').innerHTML = s.players.map(p => {
    const active = p.id === curPid && s.phase !== 'WAITING' && s.phase !== 'ENDED';
    return `<div class="player-card${active ? ' active' : ''}"
                 style="border-color:${active ? p.color : '#333'}">
      <div class="pname" style="color:${p.color}">
        ${p.nickname}${p.id === myPlayerId ? ' <small>(나)</small>' : ''}
        ${!p.connected ? ' 🔌' : ''}
      </div>
      <div class="pmoney">${won(p.money)}</div>
      <div class="pdice">
        🎲 ${p.ownDiceRemaining}개
        ${s.config.useWhiteDice ? `<span class="dice-white" style="margin-left:4px">⬜ 흰${p.whiteDiceRemaining}</span>` : ''}
      </div>
      ${active ? '<div class="ptag">현재 턴</div>' : ''}
      ${p.isBot ? '<div class="ptag" style="background:#8e44ad">🤖 AI</div>' : ''}
      ${p.team ? `<div class="ptag" style="background:${p.team === 'A' ? '#2980b9' : '#c0392b'}">${p.team}팀</div>` : ''}
    </div>`;
  }).join('');
}

function renderBoard(s) {
  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let pos = 1; pos <= 6; pos++) {
    const bills = (s.board.bills[pos] || []);
    const bets  = (s.board.bets[pos]  || []);
    const aggr  = {};
    for (const b of bets) aggr[b.owner] = (aggr[b.owner] || 0) + b.count;

    const billsHtml = bills.length
      ? bills.map(v => `<span class="bill">${won(v)}</span>`).join('')
      : '<span style="color:#444;font-size:.7rem">지폐 없음</span>';

    const betsHtml = Object.entries(aggr).sort((a, b) => b[1] - a[1]).map(([owner, cnt]) => {
      const p      = s.players.find(pp => pp.id === owner);
      const isWht  = owner === 'WHITE';
      const col    = isWht ? 'transparent' : (p ? p.color : '#aaa');
      const border = isWht ? '2px solid #7ecef5' : 'none';
      const lbl    = isWht
        ? `<span style="color:#7ecef5;font-weight:bold">⬜ 흰색</span>`
        : (p ? p.nickname : owner);
      return `<div class="bet-row">
        <div class="bet-dot" style="background:${col};border:${border};box-sizing:border-box"></div>
        <span class="bet-lbl">${lbl}: ${cnt}개</span>
      </div>`;
    }).join('') || '<span style="color:#444;font-size:.7rem">배팅 없음</span>';

    const d = document.createElement('div');
    d.className   = 'slot';
    d.innerHTML   = `<h3>${pos}번 칸</h3>
      <div class="bills">${billsHtml}</div>
      <div class="bets-area">${betsHtml}</div>`;
    el.appendChild(d);
  }
}

function renderActions(s) {
  if (!s) return;
  const curPid    = s.turnOrder[s.currentTurnIdx];
  const myTurn    = curPid === myPlayerId;
  const rollBtn   = document.getElementById('roll-btn');
  const pipDiv    = document.getElementById('pip-choice');
  const cfgPanel  = document.getElementById('config-panel');
  const title     = document.getElementById('action-title');

  // 기본 상태 초기화
  rollBtn.style.display  = 'inline-block';
  rollBtn.disabled       = true;
  pipDiv.style.display   = 'none';
  cfgPanel.style.display = 'none';

  if (s.phase === 'WAITING') {
    document.getElementById('replay-btn')?.remove();
    if (isHost) {
      title.textContent      = '⚙️  게임 설정 후 시작하세요';
      cfgPanel.style.display = 'block';
      document.getElementById('add-bot-btn').style.display = s.players.length >= 4 ? 'none' : '';
    } else {
      title.textContent = '⌛ 방장이 게임을 시작할 때까지 대기 중...';
    }
    rollBtn.style.display = 'none';

  } else if (s.phase === 'ROLLING') {
    if (myTurn) {
      title.textContent = '🎲 내 턴! 주사위를 굴리세요';
      rollBtn.disabled  = false;
    } else {
      title.textContent = `⏳ ${nick(curPid)}의 턴 — 대기 중...`;
    }

  } else if (s.phase === 'CHOOSING') {
    rollBtn.style.display = 'none';
    if (myTurn && currentRoll) {
      title.textContent    = '🎯 배팅할 눈을 선택하세요 (전부 배팅)';
      pipDiv.style.display = 'block';
      buildPipButtons(currentRoll);
    } else {
      title.textContent = `⏳ ${nick(curPid)}이(가) 눈을 선택 중...`;
    }

  } else if (s.phase === 'SETTLING') {
    title.textContent = '⚖️  라운드 정산 중...';

  } else if (s.phase === 'ENDED') {
    title.textContent = '🏆 게임 종료! 최종 결과를 확인하세요';
    rollBtn.style.display = 'none';
    if (isHost) {
      const replay = document.createElement('button');
      replay.id        = 'replay-btn';
      replay.className = 'btn-start';
      replay.textContent = '🔄 다시 플레이';
      replay.style.marginTop = '12px';
      replay.onclick = () => {
        socket.emit('game:reset', {}, (res) => {
          if (!res.ok) log('리셋 실패: ' + res.msg, 'err');
        });
      };
      if (!document.getElementById('replay-btn')) {
        document.getElementById('action-panel').appendChild(replay);
      }
    }
  }
}

function doBet(pip, diceType, count) {
  socket.emit('turn:bet', { pip, diceType }, (res) => {
    if (!res.ok) { log(res.msg, 'err'); return; }
    currentRoll = null;
    document.getElementById('pip-choice').style.display = 'none';
    const typeLabel = diceType === 'white' ? '⬜ 흰색' : '🎲 일반';
    log(`${pip}번 눈금에 ${typeLabel} 주사위 ${count}개 배팅`);
  });
}

function buildPipButtons(roll) {
  const c = document.getElementById('pip-btns');
  c.innerHTML = '';
  const hasWhite = Object.values(roll.whitePips).some(v => v > 0);
  let hasAny = false;

  for (let pip = 1; pip <= 6; pip++) {
    const own   = roll.ownPips[pip]   || 0;
    const white = roll.whitePips[pip] || 0;
    if (own > 0 || white > 0) hasAny = true;

    // 일반 주사위 버튼 — 0개면 비활성화
    {
      const btn = document.createElement('button');
      btn.className = 'pip-btn';
      btn.disabled  = own === 0;
      btn.innerHTML = `<strong>${pip}번</strong><br>
        <small>🎲 <span class="dice-own">${own}개</span></small>`;
      if (own > 0) btn.onclick = () => doBet(pip, 'own', own);
      c.appendChild(btn);
    }

    // 흰색 주사위 버튼 — 흰 주사위를 한 개라도 굴렸을 때만 표시
    if (hasWhite) {
      const btn = document.createElement('button');
      btn.className       = 'pip-btn';
      btn.style.borderColor = '#3a6a9a';
      btn.disabled        = white === 0;
      btn.innerHTML       = `<strong>${pip}번</strong><br>
        <small><span class="dice-white">⬜ 흰${white}개</span></small>`;
      if (white > 0) btn.onclick = () => doBet(pip, 'white', white);
      c.appendChild(btn);
    }
  }

  if (!hasAny) {
    c.innerHTML = '<span style="color:#666;font-size:.85rem">배팅할 주사위가 없습니다</span>';
  }
}

// ─── 타이머 ───────────────────────────────────────────────────────────────────
function updateTimer(s) {
  stopTimer();
  const fill = document.getElementById('timer-fill');
  if (!s.turnDeadline || s.phase === 'WAITING' || s.phase === 'ENDED' || s.phase === 'SETTLING') {
    fill.style.width = '100%';
    return;
  }
  const total = s.config.turnTimeMs;
  timerInterval = setInterval(() => {
    const rem = Math.max(0, s.turnDeadline - Date.now());
    fill.style.width = (rem / total * 100) + '%';
    if (fill.style.width === '0%') stopTimer();
  }, 200);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

// ─── 유틸 ────────────────────────────────────────────────────────────────────
function enterGame() {
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('game').style.display  = 'block';
}
function lobbyErr(msg) {
  const el = document.getElementById('lobby-err');
  el.textContent = msg;
  setTimeout(() => { el.textContent = ''; }, 3000);
}
function nick(pid) {
  if (!gameState) return pid?.slice(0, 6) ?? '?';
  return gameState.players.find(p => p.id === pid)?.nickname ?? pid?.slice(0, 6) ?? '?';
}
function won(v) {
  if (v === 0) return '0원';
  return (v / 10000).toFixed(0) + '만원';
}
function log(msg, cls = '') {
  const el = document.getElementById('log');
  const p  = document.createElement('p');
  p.textContent = msg;
  if (cls) p.className = cls;
  el.appendChild(p);
  el.scrollTop = el.scrollHeight;
}

// ─── 채팅 ────────────────────────────────────────────────────────────────────
let _chatUnread = 0;
let _activeTab  = 'log';

function switchTab(tab) {
  _activeTab = tab;
  document.getElementById('tab-log').classList.toggle('active',  tab === 'log');
  document.getElementById('tab-chat').classList.toggle('active', tab === 'chat');
  document.getElementById('tab-log-btn').classList.toggle('active',  tab === 'log');
  document.getElementById('tab-chat-btn').classList.toggle('active', tab === 'chat');
  if (tab === 'chat') {
    _chatUnread = 0;
    const badge = document.getElementById('chat-badge');
    badge.style.display = 'none';
    badge.textContent   = '';
    const msgs = document.getElementById('chat-msgs');
    msgs.scrollTop = msgs.scrollHeight;
    document.getElementById('chat-input').focus();
  }
}

function sendChat() {
  const input = document.getElementById('chat-input');
  const text  = input.value.trim();
  if (!text || !socket) return;
  socket.emit('chat:message', { text }, (res) => {
    if (!res?.ok) log('채팅 전송 실패: ' + (res?.msg ?? ''), 'err');
  });
  input.value = '';
}

function appendChat({ nickname, color, text, ts, isMe }) {
  const msgs = document.getElementById('chat-msgs');
  const div  = document.createElement('div');
  div.className = 'chat-msg';
  const time = new Date(ts).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  div.innerHTML =
    `<span class="chat-nick" style="color:${color}">${nickname}${isMe ? ' (나)' : ''}</span>` +
    `<span class="chat-text">${escHtml(text)}</span>` +
    `<span class="chat-time">${time}</span>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;

  // 채팅 탭이 비활성 상태면 미확인 배지 증가
  if (_activeTab !== 'chat') {
    _chatUnread++;
    const badge = document.getElementById('chat-badge');
    badge.textContent   = _chatUnread > 9 ? '9+' : String(_chatUnread);
    badge.style.display = 'inline';
  }
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function showWinnerOverlay(winner, details) {
  const overlay = document.getElementById('winner-overlay');
  const label   = document.getElementById('winner-label');
  const name    = document.getElementById('winner-name');
  const members = document.getElementById('winner-members');

  if (!details || details.isDraw) {
    label.textContent   = '게임 결과';
    name.textContent    = '🤝 무승부!';
    name.style.color    = '#aaa';
    members.textContent = '';
  } else if (details.mode === '2v2') {
    const winTeam = details.winners[0]?.team ?? '?';
    label.textContent = '팀전 우승';
    name.innerHTML    = `<span style="color:${winTeam === 'A' ? '#2980b9' : '#c0392b'}">${winTeam}팀 승리!</span>`;
    name.style.color  = '';
    const teamMoney = details.teamMoneys ? ` (${won(details.teamMoneys[winTeam])}원)` : '';
    members.innerHTML = details.winners.map(p =>
      `<span style="color:${p.color};font-weight:bold">${escHtml(p.nickname)}</span> ${won(p.money)}`
    ).join(' &nbsp;·&nbsp; ') + teamMoney;
  } else {
    const w = details.winners[0];
    label.textContent = '개인전 우승';
    name.innerHTML    = `<span style="color:${w.color}">${escHtml(w.nickname)}</span>`;
    name.style.color  = '';
    members.textContent = won(w.money);
  }

  overlay.classList.add('show');
}

function closeWinnerOverlay() {
  document.getElementById('winner-overlay').classList.remove('show');
}
</script>
